<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 創作工坊</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
        body { font-family: 'Noto Serif TC', serif; background-color: #f4f1ea; }
        .sidebar-transition { transition: all 0.3s ease; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">
    <aside id="sidebar" class="sidebar-transition w-80 bg-white border-r border-stone-200 h-full flex flex-col z-20 shadow-xl">
        <div class="p-6 overflow-y-auto no-scrollbar flex-1">
            <h1 class="text-2xl font-bold mb-6 border-b pb-2">創作設定</h1>
            <div class="mb-6">
                <label class="block text-sm font-medium mb-2">文章類型</label>
                <select id="storyType" class="w-full border rounded p-2 text-sm">
                    <option value="BL">BL</option>
                    <option value="GL">GL</option>
                    <option value="BG">BG</option>
                </select>
            </div>
            <div class="space-y-4">
                <input id="charA" type="text" placeholder="角色 A (名字, 性格)" class="w-full border rounded p-2 text-sm">
                <input id="charB" type="text" placeholder="角色 B (名字, 性格)" class="w-full border rounded p-2 text-sm">
                <textarea id="relation" rows="2" placeholder="兩人關係" class="w-full border rounded p-2 text-sm"></textarea>
            </div>
            <div class="mt-6">
                <label class="text-sm font-medium">激烈程度 <span id="intensityVal">50</span>%</label>
                <input id="intensity" type="range" min="0" max="100" value="50" oninput="document.getElementById('intensityVal').innerText = this.value" class="w-full accent-stone-700">
            </div>
            <div class="mt-8 pt-6 border-t">
                <label class="block text-xs font-medium text-stone-400 mb-1">Hugging Face Token (hf_...)</label>
                <input id="apiKey" type="password" placeholder="貼上 Token..." class="w-full border rounded p-2 text-xs bg-stone-50">
            </div>
        </div>
        <div class="p-6 bg-stone-50">
            <button onclick="generateStory()" class="w-full bg-stone-800 text-white py-3 rounded-lg font-bold hover:bg-stone-700 shadow-lg">開始生成故事</button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col relative overflow-hidden">
        <header class="h-14 flex items-center px-4 bg-white/50 border-b justify-between">
            <button onclick="toggleSidebar()" class="p-2 hover:bg-stone-200 rounded-md">
                <svg id="menuIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
            </button>
            <div class="text-stone-500 text-sm">沉浸閱讀模式</div>
            <div class="w-10"></div>
        </header>
        <div id="contentArea" class="flex-1 overflow-y-auto p-4 md:p-12 no-scrollbar">
            <div class="max-w-2xl mx-auto bg-white p-8 md:p-16 rounded-sm leading-loose text-lg text-stone-800 shadow-sm min-h-[80vh]">
                <div id="storyOutput" class="whitespace-pre-wrap text-justify">請輸入設定並點擊開始...</div>
            </div>
        </div>
    </main>

    <script>
        let isSidebarOpen = true;
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            isSidebarOpen = !isSidebarOpen;
            sidebar.style.marginLeft = isSidebarOpen ? '0' : '-320px';
        }

        async function generateStory() {
            const output = document.getElementById('storyOutput');
            const charA = document.getElementById('charA').value;
            const charB = document.getElementById('charB').value;
            const relation = document.getElementById('relation').value;
            const intensity = document.getElementById('intensity').value;
            const type = document.getElementById('storyType').value;
            const apiKey = document.getElementById('apiKey').value;

            if (!apiKey) { alert("兄弟，記得輸入 Hugging Face Token 喔！"); return; }
            output.innerHTML = `<span class="animate-pulse text-stone-400 block text-center mt-20">AI 正在努力碼字中...</span>`;

            try {
                const response = await fetch("https://api-inference.huggingface.co/models/mistralai/Mistral-7B-Instruct-v0.3", {
                    method: "POST",
                    headers: { "Authorization": `Bearer ${apiKey}`, "Content-Type": "application/json" },
                    body: JSON.stringify({
                        "inputs": `<s>[INST] 你是一位擅長描寫小說情感張力與細膩氣氛的作家。請用繁體中文寫一段 ${type} 小說情節。主角A：${charA}，主角B：${charB}。關係：${relation}。張力/激烈程度：${intensity}%。 [/INST]`,
                        "parameters": {"max_new_tokens": 1000, "temperature": 0.8}
                    })
                });
                const result = await response.json();
                let text = result[0].generated_text;
                output.innerHTML = text.split("[/INST]").pop().trim();
            } catch (e) {
                output.innerHTML = "爆炸了！錯誤訊息：" + e.message;
            }
        }
    </script>
</body>
</html>
