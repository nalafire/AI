
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 創作工坊 - 沉浸式寫作</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap');
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #f4f1ea;
        }
        .sidebar-transition {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .writing-paper {
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            min-height: 80vh;
        }
        /* 隱藏滾動條但保持功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- 左側工具列 -->
    <aside id="sidebar" class="sidebar-transition w-80 bg-white border-r border-stone-200 h-full flex flex-col z-20 shadow-xl">
        <div class="p-6 overflow-y-auto no-scrollbar flex-1">
            <h1 class="text-2xl font-bold text-stone-800 mb-6 border-b pb-2">創作設定</h1>
            
            <!-- 文章類型 -->
            <div class="mb-6">
                <label class="block text-sm font-medium text-stone-600 mb-2">文章類型</label>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="setType('BL')" class="type-btn border rounded p-2 text-sm hover:bg-stone-100 bg-stone-800 text-white" data-type="BL">BL</button>
                    <button onclick="setType('GL')" class="type-btn border rounded p-2 text-sm hover:bg-stone-100" data-type="GL">GL</button>
                    <button onclick="setType('BG')" class="type-btn border rounded p-2 text-sm hover:bg-stone-100" data-type="BG">BG</button>
                </div>
            </div>

            <!-- 角色資料 -->
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-stone-600 mb-1">角色 A (攻/主導)</label>
                    <input id="charA" type="text" placeholder="名字, 性格 (例: 墨蒼, 冷酷腹黑)" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-stone-400 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-stone-600 mb-1">角色 B (受/承接)</label>
                    <input id="charB" type="text" placeholder="名字, 性格 (例: 白羽, 倔強清冷)" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-stone-400 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-stone-600 mb-1">兩人關係</label>
                    <textarea id="relation" rows="2" placeholder="例: 宿敵、師徒、久別重逢" class="w-full border rounded p-2 text-sm focus:ring-2 focus:ring-stone-400 outline-none"></textarea>
                </div>
            </div>

            <!-- 激烈程度 -->
            <div class="mt-6">
                <div class="flex justify-between mb-1">
                    <label class="text-sm font-medium text-stone-600">激烈程度 (鋪陳 vs 高潮)</label>
                    <span id="intensityVal" class="text-sm text-stone-400">50%</span>
                </div>
                <input id="intensity" type="range" min="0" max="100" value="50" oninput="document.getElementById('intensityVal').innerText = this.value + '%'" class="w-full accent-stone-700">
            </div>

            <!-- API Key (可選) -->
            <div class="mt-8 pt-6 border-t">
                <label class="block text-xs font-medium text-stone-400 mb-1">API ENDPOINT (開發者選填)</label>
                <input id="apiKey" type="password" placeholder="輸入 API Key..." class="w-full border rounded p-2 text-xs bg-stone-50">
            </div>
        </div>

        <div class="p-6 bg-stone-50">
            <button onclick="generateStory()" class="w-full bg-stone-800 text-white py-3 rounded-lg font-bold hover:bg-stone-700 transition shadow-lg">
                開始生成故事
            </button>
        </div>
    </aside>

    <!-- 右側內容區 -->
    <main class="flex-1 flex flex-col relative overflow-hidden">
        <!-- 頂部控制欄 -->
        <header class="h-14 flex items-center px-4 bg-white/50 backdrop-blur-md border-b border-stone-200 justify-between">
            <button onclick="toggleSidebar()" class="p-2 hover:bg-stone-200 rounded-md transition">
                <svg id="menuIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
            <div class="text-stone-500 text-sm font-medium">沉浸閱讀模式</div>
            <div class="w-10"></div> <!-- 佔位平衡 -->
        </header>

        <!-- 內容顯示 -->
        <div id="contentArea" class="flex-1 overflow-y-auto p-4 md:p-12 no-scrollbar">
            <div class="max-w-2xl mx-auto writing-paper bg-white p-8 md:p-16 rounded-sm leading-loose text-lg text-stone-800">
                <div id="storyOutput" class="whitespace-pre-wrap text-justify">
                    請在左側輸入設定，並點擊「開始生成」。<br><br>
                    <span class="text-stone-400 text-sm italic">（注意：此為介面展示版本。若要真正生成，需串接後端 API 如 OpenAI 或 Unfiltered 模型）</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        let isSidebarOpen = true;
        let selectedType = 'BL';

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            isSidebarOpen = !isSidebarOpen;
            sidebar.style.marginLeft = isSidebarOpen ? '0' : '-320px';
        }

        function setType(type) {
            selectedType = type;
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.classList.remove('bg-stone-800', 'text-white');
                if(btn.dataset.type === type) btn.classList.add('bg-stone-800', 'text-white');
            });
        }

        async function generateStory() {
            const output = document.getElementById('storyOutput');
            const charA = document.getElementById('charA').value;
            const charB = document.getElementById('charB').value;
            const intensity = document.getElementById('intensity').value;

            output.innerHTML = `<span class="text-stone-400 animate-pulse text-center block mt-20 text-xl">正在編織情節中...</span>`;

            // 這裡模擬 AI 生成過程
            setTimeout(() => {
                output.innerHTML = `【${selectedType} 故事生成測試】\n\n空氣中瀰漫著一股危險的氣息。${charA}緩緩逼近，將${charB}困在牆角與自己的胸膛之間。\n\n「你以為你能逃到哪去？」${charA}的聲音低沈，帶著一絲不易察覺的顫抖。\n\n(系統訊息：目前的激烈程度設定為 ${intensity}%。在正式版中，這裡將串接 Unfiltered 模型 API，為您呈現更深入的細節描寫與情感高潮...)`;
            }, 2000);
        }
    </script>
</body>
</html>
